services:
  user_sql_server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: user_sql_server
    env_file:
      - .env
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Express
    ports:
      - "1436:1433"
    volumes:
      - ./init-db.sql:/init-db.sql
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD}' -Q 'SELECT 1' -C -b"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    entrypoint:
      - /bin/bash
      - -c
      - |
        /opt/mssql/bin/sqlservr &
        SQL_PID=$!
        echo "Waiting for SQL Server..."
        until /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD}" -Q "SELECT 1" -C -b > /dev/null 2>&1; do
          echo "Not ready yet, retrying..."
          sleep 3
        done
        sleep 3
        echo "Running init script..."
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD}" -i /init-db.sql -C
        echo "Init complete."
        wait $SQL_PID

  redis:
    image: redis:7.2-alpine
    container_name: my_redis
    env_file:
      - .env
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  sqlserver_data:
  redis_data: